name: Deploy ResepBoard ke cPanel Subdomain

on:
  push:
    branches:
      - main
      - master

jobs:
  web-deploy:
    name: Upload Otomatis ke FTP cPanel
    runs-on: ubuntu-latest
    steps:
      - name: Ambil Kode Terbaru dari Repository
        uses: actions/checkout@v4

      - name: Update Nomor Versi & Bungkus script.js ke PHP Terproteksi
        run: |
          VER=$(date +%s)
          sed -i "s/style.css?v=[0-9]*/style.css?v=$VER/g" index.html
          sed -i "s/load_js.php?v=[0-9]*/load_js.php?v=$VER/g" index.html
          sed -i "s/favicon.ico?v=[0-9]*/favicon.ico?v=$VER/g" index.html
          sed -i "s/logo_dmu.png?v=[0-9]*/logo_dmu.png?v=$VER/g" index.html
          printf "<?php if (!defined('ALLOW_SCRIPT_LOAD')) { http_response_code(403); exit('403 Forbidden'); } ?>\n" > _core_script.php
          cat script.js >> _core_script.php
          rm -f script.js

      - name: Sinkronisasi File ke Folder Subdomain cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Jangan pernah menimpa atau menghapus file config.php yang sudah ada di cPanel
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            config.php
